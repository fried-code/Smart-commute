<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commute Punjab Live </title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Leaflet Routing Machine CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <a href="index.html" class="btn btn-outline-light me-2">← Back</a>
      <a class="navbar-brand" href="index.html">Commute Punjab</a>
      <span class="navbar-text">Live Tracker</span>
    </div>
  </nav>

  <!-- Bottom Navigation -->
  <nav class="navbar fixed-bottom navbar-light bg-light">
    <div class="container-fluid justify-content-around">
      <a href="home.html" class="btn btn-outline-primary p-2">Home</a>
      <a href="index.html" class="btn btn-outline-primary p-2">Map</a>
      <a href="buses.html" class="btn btn-outline-primary p-2">Buses</a>
      <a href="user.html" class="btn btn-outline-primary p-2">Profile</a>
    </div>
  </nav>

  <!-- Live Tracker -->
  <div class="container mt-3 mb-5">
    <h2 class="text-center mb-3">Live Bus Tracker</h2>

    <!-- Route Search Form -->
    <div class="row justify-content-center mb-3">
      <div class="col-md-8">
        <form id="routeForm" class="d-flex gap-2">
          <select id="fromLocation" class="form-select" required>
            <option value="">From</option>
          </select>
          <select id="toLocation" class="form-select" required>
            <option value="">To</option>
          </select>
          <button type="submit" class="btn btn-primary">Show Route</button>
        </form>
      </div>
    </div>

    <button id="checkBusBtn" class="btn btn-primary mb-3">Check Bus</button>

    <div id="map" style="height:500px; border-radius:10px;"></div>

    <!-- Occupancy Legend -->
    <div id="occupancyLegend" class="row justify-content-center mt-3" style="display: none;">
      <div class="col-md-8">
        <div class="d-flex justify-content-around align-items-center">
          <div class="text-center"><div class="occupancy-square crowded mb-1"></div><span>Crowded (>75%)</span></div>
          <div class="text-center"><div class="occupancy-square moderate mb-1"></div><span>Moderate (50-75%)</span></div>
          <div class="text-center"><div class="occupancy-square low mb-1"></div><span>Low (25-50%)</span></div>
          <div class="text-center"><div class="occupancy-square empty mb-1"></div><span>Empty (<25%)</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Starred Buses -->
  <div id="starredBuses" class="container mt-3"></div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
  <script>
    // ---------------- Map ----------------
    const map = L.map("map").setView([31.633,74.8723], 7);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap contributors"
    }).addTo(map);

    const routeLayerGroup = L.layerGroup().addTo(map);
    const occupancyLayerGroup = L.layerGroup().addTo(map);
    let routingControl = null;
    let isOccupancyVisible = false;

    const busIcon = L.icon({
      iconUrl:"https://cdn-icons-png.flaticon.com/512/61/61205.png",
      iconSize:[32,32], iconAnchor:[16,16]
    });

    // ---------------- Stops and Coords ----------------
    const stops = ["Amritsar", "Beas", "Jalandhar", "Chandigarh", "Kharar", "Ludhiana", "Jammu", "Kathua", "Pathankot"];

    function getCoords(stop) {
      const coordMap = {
        "Amritsar": [31.633, 74.8723],
        "Beas": [31.56, 75.12],
        "Jalandhar": [31.326, 75.5762],
        "Chandigarh": [30.7333, 76.7794],
        "Kharar": [30.76, 76.72],
        "Ludhiana": [30.901, 75.857],
        "Jammu": [32.7266, 74.857],
        "Kathua": [32.37, 75.52],
        "Pathankot": [32.27, 75.65]
      };
      return coordMap[stop] || [31.633, 74.8723];
    }

    // ---------------- Sample Bus Data ----------------
    const buses = [
      { id:1, code:"101", name:"Bus 101", from:"Amritsar", to:"Jalandhar", pricePerSeat:120, stops:["Amritsar","Beas","Jalandhar"], duration:"2h 15m", onTime:true, totalSeats:50, occupied:Math.floor(Math.random()*50) },
      { id:2, code:"102", name:"Bus 102", from:"Amritsar", to:"Ludhiana", pricePerSeat:140, stops:["Amritsar","Beas","Ludhiana"], duration:"3h 10m", onTime:false, totalSeats:50, occupied:Math.floor(Math.random()*50) },
      { id:3, code:"103", name:"Bus 103", from:"Chandigarh", to:"Ludhiana", pricePerSeat:150, stops:["Chandigarh","Kharar","Ludhiana"], duration:"1h 50m", onTime:true, totalSeats:50, occupied:Math.floor(Math.random()*50) },
      { id:4, code:"104", name:"Bus 104", from:"Jammu", to:"Pathankot", pricePerSeat:200, stops:["Jammu","Kathua","Pathankot"], duration:"4h 05m", onTime:true, totalSeats:50, occupied:Math.floor(Math.random()*50) },
      { id:5, code:"105", name:"Bus 105", from:"Pathankot", to:"Jammu", pricePerSeat:190, stops:["Pathankot","Kathua","Jammu"], duration:"3h 45m", onTime:true, totalSeats:50, occupied:Math.floor(Math.random()*50) },
      { id:6, code:"106", name:"Bus 106", from:"Ludhiana", to:"Chandigarh", pricePerSeat:130, stops:["Ludhiana","Kharar","Chandigarh"], duration:"1h 30m", onTime:false, totalSeats:50, occupied:Math.floor(Math.random()*50) },
      { id:7, code:"107", name:"Bus 107", from:"Jalandhar", to:"Amritsar", pricePerSeat:125, stops:["Jalandhar","Beas","Amritsar"], duration:"2h 20m", onTime:true, totalSeats:50, occupied:Math.floor(Math.random()*50) },
      { id:8, code:"108", name:"Bus 108", from:"Chandigarh", to:"Amritsar", pricePerSeat:160, stops:["Chandigarh","Ludhiana","Jalandhar","Amritsar"], duration:"4h 00m", onTime:true, totalSeats:50, occupied:Math.floor(Math.random()*50) },
      { id:9, code:"109", name:"Bus 109", from:"Jammu", to:"Amritsar", pricePerSeat:250, stops:["Jammu","Pathankot","Amritsar"], duration:"6h 30m", onTime:false, totalSeats:50, occupied:Math.floor(Math.random()*50) },
      { id:10, code:"110", name:"Bus 110", from:"Ludhiana", to:"Pathankot", pricePerSeat:220, stops:["Ludhiana","Jalandhar","Amritsar","Pathankot"], duration:"5h 15m", onTime:true, totalSeats:50, occupied:Math.floor(Math.random()*50) },
      { id:11, code:"111", name:"Bus 111", from:"Amritsar", to:"Chandigarh", pricePerSeat:155, stops:["Amritsar","Beas","Jalandhar","Chandigarh"], duration:"3h 45m", onTime:true, totalSeats:50, occupied:Math.floor(Math.random()*50) },
      { id:12, code:"112", name:"Bus 112", from:"Pathankot", to:"Chandigarh", pricePerSeat:240, stops:["Pathankot","Jammu","Amritsar","Chandigarh"], duration:"7h 00m", onTime:false, totalSeats:50, occupied:Math.floor(Math.random()*50) },
      { id:13, code:"113", name:"Bus 113", from:"Kharar", to:"Kathua", pricePerSeat:180, stops:["Kharar","Ludhiana","Jalandhar","Kathua"], duration:"4h 50m", onTime:true, totalSeats:50, occupied:Math.floor(Math.random()*50) },
      { id:14, code:"114", name:"Bus 114", from:"Beas", to:"Jammu", pricePerSeat:210, stops:["Beas","Amritsar","Pathankot","Jammu"], duration:"5h 40m", onTime:true, totalSeats:50, occupied:Math.floor(Math.random()*50) }
    ];

    function getOccupancyClass(percentage) {
      if (percentage > 75) return 'crowded';
      if (percentage > 50) return 'moderate';
      if (percentage > 25) return 'low';
      return 'empty';
    }

    function drawOccupancy() {
      occupancyLayerGroup.clearLayers();
      buses.forEach(bus => {
        const percentage = (bus.occupied / bus.totalSeats) * 100;
        const className = getOccupancyClass(percentage);

        // Draw blue route polyline
        L.polyline(bus.polyline, {color: 'blue', weight: 3, opacity: 0.7}).addTo(occupancyLayerGroup);

        // Add colored square markers for each stop
        bus.stops.forEach(stop => {
          const coords = getCoords(stop);
          const squareHtml = `<div class="occupancy-square ${className}">${Math.round(percentage)}%</div>`;
          const stopMarker = L.marker(coords, {
            icon: L.divIcon({
              html: squareHtml,
              className: 'occupancy-marker',
              iconSize: [30, 30],
              iconAnchor: [15, 15]
            })
          }).addTo(occupancyLayerGroup);
          stopMarker.bindPopup(`<b>${stop}</b><br>Occupancy: ${Math.round(percentage)}% (Bus: ${bus.code})`);
        });
      });
    }

    function toggleOccupancy() {
      isOccupancyVisible = !isOccupancyVisible;
      const btn = document.getElementById('checkBusBtn');
      const legend = document.getElementById('occupancyLegend');
      if (isOccupancyVisible) {
        drawOccupancy();
        map.addLayer(occupancyLayerGroup);
        btn.innerText = 'Hide Occupancy';
        legend.style.display = 'block';
      } else {
        map.removeLayer(occupancyLayerGroup);
        btn.innerText = 'Check Bus';
        legend.style.display = 'none';
      }
    }

    // Compute paths from stops
    buses.forEach(bus => {
      bus.path = bus.stops.map(stop => getCoords(stop));
      bus.polyline = bus.path; // initial straight line
      bus.currentIndex = 0;
      bus.progress = 0; // 0 to 1 between current and next stop
      bus.coords = bus.path[0]; // Start at first stop
    });

    const busMarkers = {};

    let starredBuses = JSON.parse(localStorage.getItem('starredBuses')) || [];

    // ---------------- Book Bus Function ----------------
    function bookBus(busId) {
      window.location.href = `buses.html?busId=${busId}`;
    }

    function bookRouteBus(from, to) {
      window.location.href = `buses.html?from=${from}&to=${to}`;
    }

    function starBus(busId) {
      if (starredBuses.includes(busId)) {
        starredBuses = starredBuses.filter(id => id !== busId);
      } else {
        starredBuses.push(busId);
      }
      localStorage.setItem('starredBuses', JSON.stringify(starredBuses));
      displayStarredBuses();
      const bus = buses.find(b => b.id === busId);
      if (bus) {
        busMarkers[busId].getPopup().setContent(getPopupContent(bus));
      }
    }

    function displayStarredBuses() {
      const container = document.getElementById('starredBuses');
      container.innerHTML = '<h3>Starred Buses</h3>';
      if (starredBuses.length === 0) {
        container.innerHTML += '<p>No starred buses yet.</p>';
        return;
      }
      starredBuses.forEach(id => {
        const bus = buses.find(b => b.id === id);
        if (bus) {
          container.innerHTML += `
            <div class="card mb-2">
              <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                  <h5 class="mb-1">${bus.name}</h5>
                  <p class="mb-1">From ${bus.from} to ${bus.to}</p>
                  <p class="mb-1">Seats Available: ${bus.totalSeats - bus.occupied}/${bus.totalSeats}</p>
                  <small>Price: ₹${bus.pricePerSeat} | Duration: ${bus.duration}</small>
                </div>
                <button class="btn btn-primary" onclick="bookBus(${bus.id})">Book</button>
              </div>
            </div>
          `;
        }
      });
    }

    function getPopupContent(bus) {
      const starred = starredBuses.includes(bus.id);
      const starText = starred ? 'Unstar' : 'Star';
      return `<b>${bus.name}</b><br>Status: On Route<br>Lat: ${bus.coords[0].toFixed(3)}, Lng: ${bus.coords[1].toFixed(3)}<br>Seats: ${bus.totalSeats - bus.occupied}/${bus.totalSeats}<br><button class="btn btn-sm btn-success mt-2" onclick="bookBus(${bus.id})">Book</button><button class="btn btn-sm btn-warning mt-2 ms-2" onclick="starBus(${bus.id})">${starText}</button>`;
    }

    // ---------------- Live Simulation ----------------
    function moveBus(bus){
      if (bus.polyline.length < 2) {
        bus.coords = bus.path[0] || [31.633, 74.8723];
        if (busMarkers[bus.id]) {
          busMarkers[bus.id].setLatLng(bus.coords);
        }
        return;
      }
      bus.progress += 0.002; // Increment progress (even slower)
      if (bus.progress >= 1) {
        bus.progress = 0;
        bus.currentIndex = (bus.currentIndex + 1) % bus.polyline.length;
      }
      const currentIndex = bus.currentIndex;
      const nextIndex = (currentIndex + 1) % bus.polyline.length;
      const current = bus.polyline[currentIndex];
      const next = bus.polyline[nextIndex];
      if (!current || !next || current.length < 2 || next.length < 2) {
        bus.progress = 0;
        return;
      }
      const lat = current[0] + (next[0] - current[0]) * bus.progress;
      const lng = current[1] + (next[1] - current[1]) * bus.progress;
      bus.coords = [lat, lng];
      if (busMarkers[bus.id]) {
        busMarkers[bus.id].setLatLng([lat, lng]);
        busMarkers[bus.id].getPopup().setContent(getPopupContent(bus));
      }
    }

    // Function to compute road routes
    async function computeRoutes() {
      const router = L.Routing.osrmv1();
      const promises = buses.map(async (bus) => {
        try {
          if (bus.stops.length <= 2) {
            // Direct route for 2 stops
            const waypoints = bus.stops.map(stop => L.latLng(getCoords(stop)));
            const routes = await router.route(waypoints);
            if (routes && routes.length > 0 && routes[0].coordinates) {
              const validCoords = routes[0].coordinates
                .filter(coord => coord && typeof coord.lat === 'number' && typeof coord.lng === 'number')
                .map(coord => [coord.lat, coord.lng]);
              bus.polyline = validCoords.length >= 2 ? validCoords : bus.path;
            } else {
              bus.polyline = bus.path; // fallback to straight
            }
          } else {
            // Chain routes between consecutive stops for multi-stop
            let fullPolyline = [];
            for (let index = 0; index < bus.stops.length - 1; index++) {
              try {
                const stop = bus.stops[index];
                const nextStop = bus.stops[index + 1];
                const waypoints = [L.latLng(getCoords(stop)), L.latLng(getCoords(nextStop))];
                const routes = await router.route(waypoints);
                if (routes && routes.length > 0 && routes[0].coordinates) {
                  const segment = routes[0].coordinates
                    .filter(coord => coord && typeof coord.lat === 'number' && typeof coord.lng === 'number')
                    .map(coord => [coord.lat, coord.lng]);
                  fullPolyline.push(...segment);
                } else {
                  // Add straight line segment
                  fullPolyline.push(getCoords(stop), getCoords(nextStop));
                }
              } catch (segmentErr) {
                console.warn(`Routing failed for segment ${bus.id}:`, segmentErr);
                const stop = bus.stops[index];
                const nextStop = bus.stops[index + 1];
                fullPolyline.push(getCoords(stop), getCoords(nextStop));
              }
            }
            bus.polyline = fullPolyline.length >= 2 ? fullPolyline : bus.path; // fallback
          }
        } catch (err) {
          console.warn(`Routing failed for bus ${bus.id}:`, err);
          bus.polyline = bus.path; // fallback to straight
        }
      });
      await Promise.all(promises);
      // Routes computed, reset buses to start of new polylines
      buses.forEach(bus => {
        if (bus.polyline.length >= 2) {
          bus.currentIndex = 0;
          bus.progress = 0;
          bus.coords = bus.polyline[0];
          if (busMarkers[bus.id]) {
            busMarkers[bus.id].setLatLng(bus.coords);
          }
        }
      });
    }

    // Add markers immediately
    buses.forEach(bus=>{
      const marker = L.marker(bus.coords, {icon:busIcon}).addTo(map)
        .bindPopup(getPopupContent(bus));
      busMarkers[bus.id] = marker;
    });

    // Start animation immediately with straight lines
    setInterval(()=>{
      buses.forEach(moveBus);
    }, 500); // Update every 500ms for slower movement

    // Start computing routes
    computeRoutes();

    // Event listener for Check Bus button
    document.getElementById('checkBusBtn').addEventListener('click', toggleOccupancy);

    // ---------------- Route Search ----------------
    // Populate dropdowns
    const fromSelect = document.getElementById('fromLocation');
    const toSelect = document.getElementById('toLocation');
    stops.forEach(stop => {
      const option1 = new Option(stop, stop);
      const option2 = new Option(stop, stop);
      fromSelect.add(option1);
      toSelect.add(option2);
    });

    // Form handler
    document.getElementById('routeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const from = fromSelect.value;
      const to = toSelect.value;
      if (!from || !to || from === to) {
        alert('Please select different From and To locations.');
        return;
      }

      const fromCoords = getCoords(from);
      const toCoords = getCoords(to);

      // Clear previous route
      routeLayerGroup.clearLayers();
      if (routingControl) {
        map.removeControl(routingControl);
      }

      // Add routing control for road-following route
      routingControl = L.Routing.control({
        waypoints: [
          L.latLng(fromCoords[0], fromCoords[1]),
          L.latLng(toCoords[0], toCoords[1])
        ],
        routeWhileDragging: false,
        addWaypoints: false,
        createMarker: function() { return null; }, // no default markers
        lineOptions: {
          styles: [{ color: '#368F8B', weight: 5 }]
        }
      }).addTo(map);

      // Add custom markers for from and to
      L.marker(fromCoords).addTo(routeLayerGroup).bindPopup(`<b>From: ${from}</b>`).openPopup();
      L.marker(toCoords).addTo(routeLayerGroup).bindPopup(`<b>To: ${to}</b>`);

      // Add a bookable bus marker at from location
      const routeBusMarker = L.marker(fromCoords, {icon: busIcon}).addTo(routeLayerGroup)
        .bindPopup(`<b>New Bus: ${from} to ${to}</b><br>Status: Ready to Book<br><button class="btn btn-sm btn-success mt-2" onclick="bookRouteBus('${from}', '${to}')">Book</button>`);
    });

    // Display starred buses on load
    displayStarredBuses();
  </script>
</body>
</html>
