<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BusTrack+ Web Client</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- QRCode -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ---------------- Navbar ---------------- -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">BusTrack+</a>

      <!-- User Profile Dropdown -->
      <div class="dropdown ms-auto">
        <a class="nav-link dropdown-toggle" href="#" role="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
          <img src="userrvedikbhilwara.png" alt="User" width="40" height="40">
        </a>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
          <li><h6 class="dropdown-header">vedikBhiwara</h6></li>
          <li><span class="dropdown-item-text">Vedik Bhiwara@example.com</span></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item" href="user.html">Profile</a></li>
          <li><a class="dropdown-item" href="#">Settings</a></li>
          <li><a class="dropdown-item" href="#">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-3">

    <!-- ---------------- Search Panel ---------------- -->
    <div class="row mb-3">
      <div class="col-md-3">
        <input type="text" id="fromInput" class="form-control" placeholder="From">
      </div>
      <div class="col-md-3">
        <input type="text" id="toInput" class="form-control" placeholder="To">
      </div>
      <div class="col-md-2">
        <input type="text" id="busCodeInput" class="form-control" placeholder="Bus Code">
      </div>
      <div class="col-md-2">
        <button class="btn btn-search w-100" id="findRouteBtn">Search</button>
      </div>
    </div>

    <!-- ---------------- Map ---------------- -->
    <div id="map"></div>

    <!-- ---------------- Trip Summary ---------------- -->
    <div class="card mt-3" id="tripSummary" style="display:none;">
      <div class="card-body" id="tripSummaryText"></div>
    </div>

    <!-- ---------------- Bus List ---------------- -->
    <div class="row mt-3" id="busList"></div>

  </div>

  <!-- ---------------- Booking Modal ---------------- -->
  <div class="modal fade" id="bookingModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Book Your Ticket</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">

          <input type="hidden" id="selectedBusId">

          <form id="bookingForm">
            <div class="mb-3">
              <label for="passengerName" class="form-label">Name</label>
              <input type="text" class="form-control" id="passengerName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Select Seats</label>
              <div id="seatMap" class="d-flex flex-wrap"></div>
              <p class="mt-2">Selected Seats: <span id="selectedSeats">0</span> | Total Price: ₹<span id="totalPrice">0</span></p>
            </div>
            <button type="submit" class="btn btn-success">Confirm Booking</button>
          </form>

          <div id="qrCodeContainer" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ---------------- Scripts ---------------- -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
